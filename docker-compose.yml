services:
  postgres:
    image: postgres:16-alpine
    container_name: prisma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prisma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prisma}
      POSTGRES_DB: ${POSTGRES_DB:-prisma_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prisma} -d ${POSTGRES_DB:-prisma_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: prisma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-prisma}:${POSTGRES_PASSWORD:-prisma}@postgres:5432/${POSTGRES_DB:-prisma_ai}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,https://aiprisma.tech}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-openclaw}
      AGENT_API_URL: ${AGENT_API_URL:-http://host.docker.internal:2026/v1}
      AGENT_API_KEY: ${AGENT_API_KEY:-sk-b3f1a5e1ce5843aa-w9huiy-f9654c92}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-gpt-4o-mini}
      PREDICTIVE_PROVIDER: ${PREDICTIVE_PROVIDER:-regression}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      SIMULATION_INTERVAL_SECONDS: ${SIMULATION_INTERVAL_SECONDS:-5}
      PREDICTION_HORIZON_MINUTES: ${PREDICTION_HORIZON_MINUTES:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    container_name: prisma-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
